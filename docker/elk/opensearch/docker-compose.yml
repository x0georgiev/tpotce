services:

# ELK services
## OpenSearch service
  opensearch:
    build: .
    container_name: opensearch
    restart: always
    environment:
     - bootstrap.memory_lock=true
     - OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m
    cap_add:
     - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    ports:
     - "127.0.0.1:64298:9200"
    image: "ghcr.io/telekom-security/opensearch:24.04.1"
    volumes:
     - $HOME/tpotce/data:/data
