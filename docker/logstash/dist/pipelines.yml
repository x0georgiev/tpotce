# tpot_geoip.conf is generated by entrypoint.sh and must sort after the main config,
# so its geoip filters run once src_ip / t-pot_ip_ext are set.
- pipeline.id: logstash
  path.config: "/etc/logstash/{logstash,tpot_geoip}.conf"
  pipeline.ecs_compatibility: disabled
- pipeline.id: http_input
  path.config: "/etc/logstash/{http_input,tpot_geoip}.conf"
  pipeline.ecs_compatibility: disabled
