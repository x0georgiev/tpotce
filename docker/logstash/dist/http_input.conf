# Input section
input {
  http {
    id => "tpot"
    host => "0.0.0.0"
    port => "64305"
    ecs_compatibility => disabled
  }
}

# Output section
output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    # Index template and index lifecycle (ISM) are managed by the entrypoint
    index => "logstash-%{+YYYY.MM.dd}"
    manage_template => false
  }
